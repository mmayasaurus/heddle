# Gate — the required merge check for heddle (core).
#
# What it proves: the TypeScript compiles under `strict` (`npm run typecheck`,
# src/ AND test/), the vitest suite passes (`npm test` — behavioural tests for
# the ledger + routing table, HED-17), `npm run build` emits dist/, and the
# emitted CLI actually starts and reads its own routing table + skill packs
# (`classes` / `packs` are offline commands — no provider CLI, no network, no
# ledger writes). "tsc passed" alone is not "it runs"; the smoke step is the
# difference. That real work lives in the `build` job.
#
# What it does NOT prove: there is no lint yet (HED-15). Dispatch/adapters need
# real provider CLIs and are not exercised here.
#
# Runs on GitHub-hosted runners — the repo is public, so minutes are free. The
# job NAME `gate` is the required-status-check context string for the "Protect
# main" ruleset (HED-13); renaming it silently un-requires the gate. The marker
# name `gate-verdict` is NOT required and must stay out of the ruleset (see below).
#
# ── EDIT-SAFE via a verdict echo (HED-142) ──────────────────────────────────
# GitHub resolves a required status check from the newest check-run of the
# required name in the newest check-SUITE on the head commit (suite order, not
# run completion order — measured live on dashboard#45). A PR `edited` event
# (reviewer bots edit the body constantly) re-fires this workflow with NO new
# commit, in a NEW suite. Three earlier
# fixes each died on a GitHub semantic we had inferred rather than observed; all
# six behaviours are now reproduced in a sandbox and written up in docs/CI.md:
#   • skip the edit run  → it publishes a `skipped` check-run, and `skipped`
#     SUPERSEDES a real red → a body-edit MASKS a failure. Unsafe.
#   • dynamic job name   → edits publish a DIFFERENT context, so the latest suite
#     no longer carries `gate` → the required check reads unsatisfied → the PR is
#     BLOCKED with no code cause. Unsafe (this is what attempt 3 did).
#   • re-run real work on edits in a shared slot → a bot edit CANCELS the
#     in-flight run and the cancelled required check reds the PR (dashboard#41).
# The echo satisfies all three at once. Every run — commit or edit — publishes
# the STATIC context `gate`. A commit / retarget / push run does the real work
# (`build`) and records its conclusion as a non-required `gate-verdict` marker
# check-run on the head SHA. An edit run does NOT recompute: it reads that SHA's
# latest `gate-verdict` and republishes exactly that conclusion. So an edit can
# only ever REPEAT the real verdict for the exact commit under review — green
# stays green, red stays red (no mask) — and `gate` is present on every suite
# (no block). Edit runs normally take seconds (they just read the marker); one
# that races an in-flight commit build stays PENDING, waiting for that build's
# verdict, rather than failing closed into a newer suite. They get their own
# concurrency slot with cancel-in-progress: false, so they never cancel anything
# (no cancellation-red).
# On a reopened PR the head SHA is unchanged and `reopened` is a commit-path
# event, so it simply re-runs `build` and refreshes the marker — verdicts are
# SHA-bound, so reopen carries no stale-verdict hazard.
#
# Hardening (zizmor-clean): every action hash-pinned (Dependabot bumps the pins,
# see .github/dependabot.yml), workflow-level `permissions: {}`, checkout without
# persisted credentials (build steps never see a token), runner pinned to an
# Ubuntu series (not `-latest`) so the environment only moves when we move it.
# The `gate` job alone holds `checks: write` — the least privilege the marker
# read/write needs; `build` stays `contents: read`.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
    # NO base-branch filter, and `edited` included — both halves of HED-91,
    # found live on heddle#9:
    #   * `branches: [main]` meant a STACKED PR (base = another agent's branch)
    #     never ran this workflow at all. The required check `gate` was then
    #     permanently absent, so the PR could not satisfy the ruleset — an
    #     unrunnable gate, not a failing one.
    #   * RETARGETING a PR's base (the normal move once the parent merges) fires
    #     ONLY `pull_request: edited` — no synchronize, no new commit. Without
    #     `edited` the retargeted PR silently kept the verdict it earned against
    #     the OLD base, which is a different merge result.
    # `edited` also fires on title/body edits (reviewer bots edit bodies often).
    # Those take the echo path below — see the `gate` job — so they neither skip
    # nor recompute; they republish the head SHA's real verdict.
    types: [opened, synchronize, reopened, edited]
  # Break-glass manual run, e.g. to re-check main after a runner-side outage.
  workflow_dispatch: {}

permissions: {}

# TWO SLOTS (HED-91/142). Commit-driven events (push, opened, synchronize,
# reopened) and a base RETARGET (an `edited` whose changes.base.ref.from is
# populated) share the `run` slot with cancel-in-progress: TRUE — a newer commit
# supersedes the stale run. Title/body `edited` events take the `edit` slot with
# cancel-in-progress: FALSE — echoes are ~5s and must never be cancelled, or a
# cancelled edit run could red the required context (the failure measured on
# heddle#41). Because the slots differ, a body-edit's echo NEVER cancels an
# in-flight commit run (and vice versa); the echo just polls for that run's
# marker. The discriminator is github.event.changes.base.ref.from: populated on
# a retarget, empty/absent on a title or body edit (GitHub coerces the absent
# value so `!= ''` is false for a plain edit — verified in the sandbox).
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'run' || 'edit' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}

jobs:
  build:
    # The REAL gate work. Runs on commit-driven events (push / opened /
    # synchronize / reopened / retarget) only; a title/body edit SKIPS it and the
    # `gate` job echoes the head SHA's last real verdict instead of re-running.
    name: build (typecheck + test + build + smoke)
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Latest 22.x — package.json `engines` requires >=22.12 (node:sqlite,
          # vitest 4's rolldown); `npm ci` fails fast on anything older.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + test)
        run: npm run typecheck

      # vitest — runs against src/ directly, no build needed (HED-17).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Behavioral smoke: the built CLI must start, parse routing/routing.v0.yaml
      # (the repo-relative default), and enumerate skills/. `--json` output is
      # asserted non-empty so a silent empty table can't pass as green.
      - name: Smoke the built CLI (offline commands)
        run: |
          set -euo pipefail
          node dist/cli.js >/dev/null            # usage text, exit 0
          # Each command's --json output must be a NON-EMPTY array. Under
          # `node -e`, process.argv[1] is the first extra argument (verified
          # on Node 22 locally and in the first CI run of this workflow).
          check_nonempty_array() {
            node -e '
              const v = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const name = process.argv[1];
              if (!Array.isArray(v) || v.length === 0) { console.error(name + ": empty result"); process.exit(1); }
              console.log(name + ": " + v.length + " entries");' "$1"
          }
          node dist/cli.js classes --json | check_nonempty_array classes
          node dist/cli.js packs   --json | check_nonempty_array packs

  gate:
    # Required-check context string — do NOT rename (see header; HED-13).
    #
    # Commit / retarget / push: read the real `build` result, record it as the
    # `gate-verdict` marker for the head SHA, and exit with it (this job's own
    # conclusion is the required `gate` verdict).
    # Title/body edit: `build` was skipped, so echo the head SHA's last
    # `gate-verdict` instead of recomputing — that is what stops an edit from
    # masking a red or dropping the `gate` context.
    # `if: always()` so a skipped/failed/cancelled `build` still yields a real
    # `gate` verdict here rather than a `skipped` required check (which GitHub
    # would treat as passing).
    name: gate
    needs: [build]
    if: always()
    runs-on: ubuntu-24.04
    # INVARIANT: timeout-minutes MUST exceed the longest leaf timeout in this
    # workflow (`build` = 15). The edit-path echo waits (pending) for the build's
    # verdict, so it must be able to outlast a full build rather than fail closed
    # into a newer suite (see the echo step). If you raise a leaf timeout, raise
    # this above it. 25 > 15. (Matched to Deterministic Review's echo aggregators
    # so this loop is byte-comparable to that live-proven reference — HED-182.)
    timeout-minutes: 25
    permissions:
      checks: write
    steps:
      - name: Verdict (commit) or echo (edit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR head on PR events; the pushed commit on push / workflow_dispatch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # True ONLY for a title/body edit (an `edited` event with no base
          # change). Everything else — push, opened, synchronize, reopened, a
          # base retarget, workflow_dispatch — is a commit-path run.
          IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -eu
          if [ "$IS_EDIT" = "true" ]; then
            echo "edit event — echoing the last real verdict (gate-verdict marker) for $SHA"
            CONC=none; DRY=0
            # WAIT for this SHA's real verdict; never fail closed on a timer. A
            # premature red would land in a check-suite NEWER than the commit
            # run's own gate, and GitHub resolves a required check from the newest
            # SUITE, so it would block the PR until another edit superseded it
            # (measured live on dashboard#45). The ONLY fail-closed trigger is the
            # commit-path build being verifiably GONE — no leaf job in flight —
            # with still no marker, sustained past a startup grace; there is NO
            # iteration ceiling. Invariant: this job's timeout-minutes exceeds the
            # longest leaf timeout in THIS workflow, so a leaf cannot be in flight
            # past its own timeout — either the marker appears (the echo reflects
            # it, including a timed-out build's failure) or the build is gone (fail
            # closed correctly). The loop bound is a belt sized just under this
            # job's 25-minute timeout (~24m50s at the backoff cadence) and above
            # the longest leaf timeout; it cannot end on iteration count while a
            # real leaf is still in flight. Poll fast for ~2 min, then back off to
            # 30s to spare the API rate limit on a long build.
            for i in $(seq 1 57); do
              # F4: a failed check-runs read leaves liveness UNKNOWN and retries —
              # NEVER coerce it to an empty `{}` (that jq-errors under `set -eu`
              # and reds the required gate on a single transient API blip, and it
              # also fakes "no leaf in flight", advancing the fail-closed proof).
              if ! CR=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --slurp 2>/dev/null); then
                echo "  could not read check runs for ${SHA}; build liveness is unknown — retrying"
                if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
                continue
              fi
              # F3: --paginate --slurp yields a JSON ARRAY of pages; flatten every
              # page's check_runs with [.[].check_runs[]] so a SHA with >30 checks
              # (bot-edit storms grow the count) can't split CONC across pages.
              CONC=$(printf '%s\n' "$CR" | jq -r '[.[].check_runs[]] | [ .[] | select(.name=="gate-verdict") ] | sort_by(.started_at) | last | .conclusion // "none"')
              INFLIGHT=$(printf '%s\n' "$CR" | jq -r '[.[].check_runs[]] | [ .[] | select((.name|test("^(build|web|rust)")) and .status!="completed") ] | length')
              # F2 — four states: a marker is usable only after the matching build
              # is gone; any in-flight leaf resets the dry proof, WITH OR WITHOUT a
              # stale marker (so a same-SHA recompute's fresh verdict is never
              # pre-empted by an older marker landing in a newer suite); only
              # no-marker + no-inflight advances the fail-closed proof.
              if [ "$CONC" != "none" ] && [ "$INFLIGHT" = "0" ]; then
                break
              fi
              if [ "$CONC" = "none" ] && [ "$INFLIGHT" = "0" ]; then
                DRY=$((DRY + 1))
              else
                DRY=0
              fi
              # Fail closed only when the build is verifiably gone AND still no
              # marker, sustained a few polls past the 90s grace — this bridges the
              # brief gap between the leaf jobs finishing and the commit gate
              # publishing the marker.
              if [ "$i" -gt 9 ] && [ "$DRY" -ge 6 ]; then
                echo "  build is no longer in flight and no gate-verdict marker appeared — the commit gate did not publish (cancelled / never ran)."
                break
              fi
              if [ -z "${WAITED:-}" ]; then
                WAITED=1
                {
                  echo "### gate — waiting for the commit-path verdict on \`${SHA}\`"
                  echo "This edit run is holding the required \`gate\` **pending** until the commit-path build for this commit publishes its \`gate-verdict\`, which the echo then reflects. Pending here means *blocked-while-building*, not failed."
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "  waiting for the commit run's verdict on ${SHA} (poll ${i}; marker=${CONC}, commit-path jobs in flight=${INFLIGHT}, dry=${DRY})"
              if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
            done
            case "$CONC" in
              success)
                echo "real verdict for ${SHA} = success — gate green"
                exit 0 ;;
              none)
                echo "::error::no gate-verdict marker for ${SHA} — the commit 'gate' run never published a verdict for this commit (it was cancelled or never ran; the build is no longer in flight). Re-run the 'gate' workflow on this PR, or push a commit. Failing closed."
                exit 1 ;;
              *)
                echo "::error::real verdict for ${SHA} was '${CONC}' — echoing it. An edit never masks a real failure; fix the code and push a commit."
                exit 1 ;;
            esac
          fi
          # Commit / retarget / push: the real verdict IS the `build` job result.
          case "$BUILD_RESULT" in
            success) MARK=success ;;
            *)       MARK=failure ;;
          esac
          # Record the verdict as a non-required marker on the head SHA so future
          # edit runs can echo it. Best-effort: on a fork-head PR GITHUB_TOKEN is
          # read-only regardless of `permissions:`, so this POST 403s — the gate
          # still reflects the real result below; only later EDIT runs on a fork
          # degrade (they fail closed, never mask). Same-repo branches — the
          # fleet's flow — always publish.
          if ! gh api "repos/$REPO/check-runs" -X POST -f name=gate-verdict \
                -f head_sha="$SHA" -f status=completed -f conclusion="$MARK" >/dev/null 2>&1; then
            echo "::warning::could not publish the gate-verdict marker for ${SHA} (read-only token / fork PR?) — edit runs on this commit will fail closed until a commit run can publish one."
          fi
          echo "real verdict = ${MARK} (build=${BUILD_RESULT}); recorded as gate-verdict marker for ${SHA}"
          # Make THIS job's conclusion the required verdict.
          [ "$MARK" = success ]
