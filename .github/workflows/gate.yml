# Gate — the required merge check for heddle (core).
#
# What it proves: the TypeScript compiles under `strict` (`npm run typecheck`,
# src/ AND test/), the vitest suite passes (`npm test` — behavioural tests for
# the ledger + routing table, HED-17), `npm run build` emits dist/, and the
# emitted CLI actually starts and reads its own routing table + skill packs
# (`classes` / `packs` are offline commands — no provider CLI, no network, no
# ledger writes). "tsc passed" alone is not "it runs"; the smoke step is the
# difference.
#
# What it does NOT prove: there is no lint yet (HED-15). Dispatch/adapters need
# real provider CLIs and are not exercised here.
#
# Runs on GitHub-hosted runners — the repo is public, so minutes are free. The
# job NAME `gate` is the required-status-check context string for the "Protect
# main" ruleset (HED-13); renaming it silently un-requires the gate.
#
# Hardening (zizmor-clean): every action hash-pinned (Dependabot bumps the pins,
# see .github/dependabot.yml), workflow-level `permissions: {}`, checkout without
# persisted credentials (nothing here pushes, so build steps never see a token),
# runner pinned to an Ubuntu series (not `-latest`) so the environment only
# moves when we move it.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
    # NO base-branch filter, and `edited` included — both halves of HED-91,
    # found live on heddle#9:
    #   * `branches: [main]` meant a STACKED PR (base = another agent's branch)
    #     never ran this workflow at all. The required check `gate` was then
    #     permanently absent, so the PR could not satisfy the ruleset — an
    #     unrunnable gate, not a failing one.
    #   * RETARGETING a PR's base (the normal move once the parent merges) fires
    #     ONLY `pull_request: edited` — no synchronize, no new commit. Without
    #     `edited` the retargeted PR silently kept the verdict it earned against
    #     the OLD base, which is a different merge result.
    # `edited` also fires on title/body edits (reviewer bots edit bodies often),
    # so those re-run the gate too. That is deliberate — see the note on the job
    # below for why this workflow does NOT skip them.
    types: [opened, synchronize, reopened, edited]
  # Break-glass manual run, e.g. to re-check main after a runner-side outage.
  workflow_dispatch: {}

permissions: {}

# A superseded run is dead weight: cancel it and let the newest commit's run
# report. The gate is a per-commit required check, so a cancelled stale run
# never reds the PR verdict — only the latest commit's run counts.
#
# TWO SLOTS, measured on heddle#27/#31: commit-driven events (opened,
# synchronize, reopened) and `edited` events get separate groups. With one
# shared group a reviewer bot editing the PR body CANCELLED the in-flight real
# run, and a cancelled required check reds the PR (on the dashboard the
# always() aggregator saw cancelled needs and published `gate: FAILURE`) until
# the replacement run finished — thrash, not safety. Separated, an edit still
# re-runs the gate (nothing is skipped, so no `skipped` check-run can ever
# supersede a red one) but cannot kill the run that matters.
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'edit' || 'run' }}
  cancel-in-progress: true

jobs:
  gate:
    # Required-check context string — do not rename (see header).
    #
    # This job deliberately has NO event guard, even though a PR title/body edit
    # carries no new commit. Skipping was tried and MEASURED on heddle#30, and
    # it is unsafe: a skipped job still publishes a check-run under its name,
    # GitHub's required-check evaluation takes the NEWEST run of a given name,
    # and it treats `skipped` as passing — so a reviewer bot editing the PR body
    # would have superseded a RED gate with a passing one. Making the name an
    # expression avoided that (a skipped job publishes the raw expression text
    # rather than `gate`, also measured), but left an unreadable check name.
    # Re-running is the honest option: the run evaluates the same merge ref and
    # publishes the same verdict it would otherwise have had. Public-repo
    # runner minutes are free; a maskable required check is not.
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Latest 22.x — package.json `engines` requires >=22.12 (node:sqlite,
          # vitest 4's rolldown); `npm ci` fails fast on anything older.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (src + test)
        run: npm run typecheck

      # vitest — runs against src/ directly, no build needed (HED-17).
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Behavioral smoke: the built CLI must start, parse routing/routing.v0.yaml
      # (the repo-relative default), and enumerate skills/. `--json` output is
      # asserted non-empty so a silent empty table can't pass as green.
      - name: Smoke the built CLI (offline commands)
        run: |
          set -euo pipefail
          node dist/cli.js >/dev/null            # usage text, exit 0
          # Each command's --json output must be a NON-EMPTY array. Under
          # `node -e`, process.argv[1] is the first extra argument (verified
          # on Node 22 locally and in the first CI run of this workflow).
          check_nonempty_array() {
            node -e '
              const v = JSON.parse(require("fs").readFileSync(0, "utf8"));
              const name = process.argv[1];
              if (!Array.isArray(v) || v.length === 0) { console.error(name + ": empty result"); process.exit(1); }
              console.log(name + ": " + v.length + " entries");' "$1"
          }
          node dist/cli.js classes --json | check_nonempty_array classes
          node dist/cli.js packs   --json | check_nonempty_array packs
