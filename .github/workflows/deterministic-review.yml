# Deterministic Review — the NON-AI reviewer tier (ported from Spinventory's
# deterministic-review.yml, Maya-approved there 2026-07-13; heddle port is HED-11).
#
# Zero-flake scanners that catch what a rule engine catches every single time,
# complementing whatever AI reviewers Maya enables (HED-13):
#   semgrep   — registry rulesets p/typescript + p/nodejs. DIFF-AWARE on PRs
#               (--baseline-commit = the merge ref's first parent, i.e. the
#               base tip actually merged: only findings this PR introduces —
#               HED-80), FULL on pushes to main (so the Security tab holds
#               the whole picture, not just deltas). PR-controlled
#               suppressions (.semgrepignore, inline nosemgrep) are
#               neutralised — see the Scan step.
#   gitleaks  — secrets in exactly the PR's commit range (base.sha..head.sha),
#               values REDACTED. Runs the official gitleaks CLI image directly
#               rather than gitleaks-action: the action lists PR commits with
#               the API default per_page=30 and never paginates, so a PR with
#               >30 commits is silently PARTIALLY scanned — and it needs a
#               write token, which fork PRs never get. Push-to-main coverage is
#               GitHub's native secret scanning + push protection (enabled on
#               this repo 2026-08-15) — a second engine on the same pushes.
# Workflow hygiene (actionlint + zizmor) lives in actions-hygiene.yml, path-
# filtered to .github/ changes.
#
# Where findings show up — DIFFERENT PLUMBING from Spinventory, SAME DISCIPLINE:
# instead of a hand-rolled, sanitized PR-comment poster, results are uploaded
# as SARIF to GitHub code scanning (free on public repos): they render as the
# "Code scanning results / <tool>" check + inline annotations on the PR and in
# the repo's Security tab; each job also writes a one-line job summary. The PR
# sweep (review discipline doc, HED-16) must read code-scanning alerts + the
# checks tab, not only comments/reviews/threads.
#
# Fork PRs: the SCANS run for everyone (read-only token is enough — nothing
# here checks out untrusted code with secrets, and no PR-controlled string is
# expanded into a run: block); only the SARIF-upload steps, which need a write
# token, are skipped for forks — the log + job summary still carry the result.
#
# Posture: semgrep is REPORT-ONLY (the job never reds on findings; code
# scanning's own "check failure" threshold decides whether its check reds —
# repo default: errors only). gitleaks is BLOCKING-red on a hit (rotating the
# secret is the fix, not re-running CI) but NOT a required check.
#
# Hardening (zizmor-clean): every action hash-pinned + Dependabot-bumped;
# container images tag+digest-pinned (Dependabot does NOT track `container:`
# images or `docker://` uses — bump those by hand, see the notes at each one);
# workflow-level `permissions: {}`; checkout without persisted credentials;
# runners pinned to an Ubuntu series (ubuntu-24.04), not `-latest`.
name: Deterministic Review

on:
  pull_request:
    # `edited` is here for ONE reason: retargeting the PR's base branch moves
    # semgrep's baseline and gitleaks' commit range, so the scans must re-run.
    # `edited` also fires on title/body edits — those runs echo the head SHA's
    # last real scanner verdict instead of scanning or publishing `skipped`.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

# TWO SLOTS (HED-131). Commit / retarget / push runs take the `scan` slot and a
# newer run cancels stale work. Title/body edits take the `noop` slot with
# cancellation disabled: their verdict echoes are fast and must never cancel
# either an in-flight real scan or one another.
concurrency:
  group: det-review-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'scan' || 'noop' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}

jobs:
  semgrep:
    name: semgrep (diff-aware on PRs · full on main)
    # Every push to main is scanned. PRs: skip drafts and Dependabot's own PRs
    # (Dependabot gets a read-only token that cannot upload SARIF — semgrep's
    # sample config skips them too); the guard is PR-only so a main push whose
    # actor happens to be dependabot is still scanned. Every title/body edit
    # enters the echo path (including drafts/Dependabot, where a missing marker
    # is an intentional fail-closed red); retarget edits scan because the
    # baseline moved.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       ((github.event.action == 'edited' && github.event.changes.base.ref.from == '') ||
        (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')))
    runs-on: ubuntu-24.04
    # INVARIANT: the edit-path timeout (20) MUST exceed the commit-path scan
    # timeout (15). The echo waits pending while that scan is in flight; if the
    # scan budget rises, raise the echo budget above it too.
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 20 || 15 }}
    permissions:
      contents: read
      checks: write
      security-events: write  # SARIF upload to code scanning (same-repo only)
    env:
      IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
    container:
      # Semgrep's documented CI image (docs.semgrep.dev sample-ci-configs),
      # tag+digest-pinned. MANUAL BUMP (Dependabot ignores container images):
      # bump the tag, refresh the digest from Docker Hub, and expect newer
      # rules = new findings.
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - name: Echo the last real semgrep verdict (title/body edit)
        if: env.IS_EDIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        # The image is Python-based. urllib + json avoid assumptions about curl
        # or jq, and every tooling / HTTP / JSON failure is an explicit red.
        run: |
          set -eu
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 is unavailable while echoing semgrep-verdict for ${SHA} — re-run the Deterministic Review scan or push a commit. Failing closed."
            exit 1
          fi
          case "$RUN_ID" in
            ''|*[!0-9]*)
              echo "::error::the Actions run id is unavailable while echoing semgrep-verdict for ${SHA} — re-run the Deterministic Review scan or push a commit. Failing closed."
              exit 1 ;;
          esac
          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          token = os.environ["GH_TOKEN"]
          run_id = int(os.environ["RUN_ID"])
          marker_name = "semgrep-verdict"
          scan_name = "semgrep (diff-aware on PRs · full on main)"
          remedy = "re-run the Deterministic Review scan or push a commit"

          def fail(message):
              print(f"::error::{message} for {sha} — {remedy}. Failing closed.")
              raise SystemExit(1)

          def list_check_runs(name):
              runs = []
              page = 1
              total = None
              while True:
                  query = urllib.parse.urlencode({
                      "check_name": name,
                      "filter": "all",
                      "per_page": 100,
                      "page": page,
                  })
                  url = f"https://api.github.com/repos/{repo}/commits/{sha}/check-runs?{query}"
                  request = urllib.request.Request(url, headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "heddle-deterministic-review",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status != 200:
                              fail(f"Checks API GET returned HTTP {response.status}")
                          payload = json.load(response)
                  except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError, OSError) as error:
                      fail(f"Checks API GET failed ({type(error).__name__})")
                  if not isinstance(payload, dict) or not isinstance(payload.get("total_count"), int) or not isinstance(payload.get("check_runs"), list):
                      fail("Checks API GET returned an unparseable response")
                  if total is None:
                      total = payload["total_count"]
                  elif payload["total_count"] != total:
                      fail("Checks API pagination changed while it was being read")
                  page_runs = payload["check_runs"]
                  runs.extend(page_runs)
                  if len(runs) >= total:
                      return runs
                  if not page_runs:
                      fail("Checks API pagination ended before total_count")
                  page += 1

          def latest_marker():
              markers = list_check_runs(marker_name)
              if not markers:
                  return None
              for marker in markers:
                  if (not isinstance(marker, dict) or marker.get("name") != marker_name or
                          marker.get("head_sha") != sha or not isinstance(marker.get("id"), int) or
                          not isinstance(marker.get("started_at"), str)):
                      fail("the semgrep-verdict marker response was missing or ambiguous")
              marker = max(markers, key=lambda item: (item["started_at"], item["id"]))
              if marker.get("status") != "completed" or not isinstance(marker.get("conclusion"), str):
                  fail("the latest semgrep-verdict marker was incomplete or unparseable")
              return marker["conclusion"]

          def commit_scans_in_flight():
              count = 0
              for check in list_check_runs(scan_name):
                  if not isinstance(check, dict) or check.get("name") != scan_name:
                      fail("the semgrep scan check response was missing or ambiguous")
                  status = check.get("status")
                  if status == "completed":
                      continue
                  details_url = check.get("details_url")
                  match = re.search(r"/actions/runs/([0-9]+)/job/", details_url or "")
                  if not isinstance(status, str) or match is None:
                      fail("an in-flight semgrep check could not be identified")
                  other_run_id = int(match.group(1))
                  if other_run_id == run_id:
                      continue
                  # The noop slot serializes edit echoes, so another RUNNING
                  # same-name check is a commit-path scan. An older queued check
                  # is also commit-path; a newer queued one is a later edit.
                  if status == "in_progress" or other_run_id < run_id:
                      count += 1
              return count

          print(f"edit event — echoing the last real verdict ({marker_name} marker) for {sha}")
          poll = 0
          dry = 0
          summarized = False
          while True:
              poll += 1
              conclusion = latest_marker()
              if conclusion is not None:
                  if conclusion == "success":
                      print(f"real semgrep verdict for {sha} = success — semgrep green")
                      raise SystemExit(0)
                  if conclusion == "failure":
                      fail("the real semgrep verdict was 'failure'; an edit never masks a real failure")
                  fail(f"the real semgrep verdict had unsupported conclusion {conclusion!r}")

              in_flight = commit_scans_in_flight()
              dry = dry + 1 if in_flight == 0 else 0
              # No fixed iteration ceiling: only a verifiably absent commit
              # scan, sustained after the startup grace, can end the wait.
              if poll > 9 and dry >= 6:
                  fail("no semgrep-verdict marker appeared and the commit-path semgrep scan is no longer in flight")
              if not summarized:
                  summarized = True
                  summary = os.environ.get("GITHUB_STEP_SUMMARY")
                  if not summary:
                      fail("GITHUB_STEP_SUMMARY is unavailable while the verdict is pending")
                  try:
                      with open(summary, "a", encoding="utf-8") as stream:
                          stream.write(f"### semgrep — waiting for the commit-path verdict on `{sha}`\n")
                          stream.write("This edit run is holding `semgrep` **pending** until the commit-path scan for this commit publishes its `semgrep-verdict`, which the echo then reflects. Pending here means *blocked-while-scanning*, not failed.\n")
                  except OSError as error:
                      fail(f"the pending-state job summary could not be written ({type(error).__name__})")
              print(f"  waiting for the commit run's semgrep verdict on {sha} (poll {poll}; marker absent, commit-path jobs in flight={in_flight}, dry={dry})", flush=True)
              time.sleep(10 if poll < 12 else 30)
          PY

      - name: Checkout (full history — the baseline commit must be present)
        if: env.IS_EDIT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        id: scan
        if: env.IS_EDIT != 'true'
        env:
          # PR: diff-aware; the baseline is resolved in the script below from
          # the checked-out merge commit's FIRST PARENT (the exact base tip
          # GitHub merged), NOT from pull_request.base.sha — that value is
          # recorded on the PR object and does not refresh when main moves, so
          # a scan against it attributes main's newer findings to the PR
          # (heddle-dashboard#13 → HED-80). Push: empty → full scan.
          IS_PR: ${{ github.event_name == 'pull_request' && 'yes' || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA_FALLBACK: ${{ github.event.pull_request.base.sha }}
        # POSIX sh on purpose: inside a `container:` the runner defaults to
        # `sh -e`, not bash (first run of this workflow proved it — a bash
        # array here failed with "syntax error: unexpected (").
        #
        # PR-controlled suppressions are neutralised (CodeRabbit, r3): every
        # `.semgrepignore` in the PR tree is replaced by the BASE branch's copy
        # (or removed if the base has none) and that swap is committed LOCALLY —
        # `--baseline-commit` refuses a dirty tree, and the commit never leaves
        # the runner (no credentials in .git). Inline `nosemgrep` comments are
        # ignored via --disable-nosem. `.gitignore` is not a vector: semgrep
        # only applies it to UNTRACKED files, and PR files are tracked.
        run: |
          set -u
          # Container jobs: the workspace is owned by the runner uid, git in
          # this step runs as the image user, and actions/checkout writes its
          # safe.directory entry to a TEMPORARY HOME — so without this line
          # every git call below dies with "dubious ownership" (round-4 run).
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          BASELINE=""
          if [ -n "$IS_PR" ]; then
            # actions/checkout checks out refs/pull/N/merge — GitHub's synthetic
            # merge commit: first parent = the base branch tip actually merged,
            # second parent = the PR head. Both facts are CHECKED (qodo, HED-80
            # r1): HEAD^2 must be the PR head, otherwise this is some other
            # merge commit (ref: override) and HEAD^1 would be an unrelated
            # baseline. Fallback = merge-base of the CURRENT base tip and HEAD
            # (fetch-depth 0 has origin/<base>), never the stale base.sha
            # unless even that is unavailable.
            if [ "$(git rev-parse -q --verify HEAD^2 2>/dev/null)" = "$PR_HEAD_SHA" ]; then
              BASELINE=$(git rev-parse HEAD^1)
            elif BASELINE=$(git merge-base "origin/$PR_BASE_REF" HEAD 2>/dev/null) && [ -n "$BASELINE" ]; then
              echo "::warning::HEAD is not GitHub's synthetic merge of this PR — baseline = merge-base(origin/$PR_BASE_REF, HEAD)"
            else
              BASELINE="$BASE_SHA_FALLBACK"
              echo "::warning::could not resolve the current base tip — falling back to pull_request.base.sha as the baseline (may lag main)"
            fi
          fi
          if [ -n "$BASELINE" ]; then
            git ls-files | grep -E '(^|/)\.semgrepignore$' | while IFS= read -r f; do
              git rm -q -- "$f"
            done
            git ls-tree -r --name-only "$BASELINE" | grep -E '(^|/)\.semgrepignore$' | while IFS= read -r f; do
              mkdir -p "$(dirname "$f")"; git show "$BASELINE:$f" > "$f"; git add -- "$f"
            done
            if ! git diff --cached --quiet; then
              git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci: base-branch .semgrepignore for the diff-aware scan"
              echo "::notice::.semgrepignore differs from the base branch — scanned with the base branch's copy"
            fi
          fi
          set -- scan --config p/typescript --config p/nodejs \
                 --metrics=off --disable-nosem --sarif-output=semgrep.sarif \
                 --exclude node_modules --exclude dist
          if [ -n "$BASELINE" ]; then
            echo "diff-aware scan: baseline $BASELINE"
            set -- "$@" --baseline-commit="$BASELINE"
          else
            echo "full scan (push to main)"
          fi
          # No --error: report-only tier. A tool crash / unparseable output is
          # still an honest red (the upload step needs the file).
          semgrep "$@"
          # One-line receipt in the job summary. python3 is guaranteed in the
          # image (the semgrep CLI is a Python package); jq is not (qodo, r3).
          N=$(python3 -c 'import json; print(len(json.load(open("semgrep.sarif"))["runs"][0]["results"]))')
          echo "semgrep: **$N** finding(s) (${BASELINE:+new vs base }${BASELINE:-full scan})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        # Needs a write token — same-repo PRs and main pushes only; fork PRs
        # keep the scan result in the log + summary above.
        if: >-
          env.IS_EDIT != 'true' &&
          (github.event_name == 'push' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Publish semgrep verdict marker
        # Non-required recursion guard: only commit-path runs emit this marker;
        # edit-path echoes read it but never publish another marker.
        if: always() && env.IS_EDIT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          case "$JOB_STATUS" in
            success) MARK=success ;;
            *)       MARK=failure ;;
          esac
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 is unavailable while publishing semgrep-verdict for ${SHA} — re-run the Deterministic Review scan or push a commit. Failing closed."
            exit 1
          fi
          export MARK
          python3 <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["REPO"]
          sha = os.environ["SHA"]
          mark = os.environ["MARK"]
          remedy = "re-run the Deterministic Review scan or push a commit"
          body = json.dumps({
              "name": "semgrep-verdict",
              "head_sha": sha,
              "status": "completed",
              "conclusion": mark,
          }).encode("utf-8")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/check-runs",
              data=body,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Content-Type": "application/json",
                  "User-Agent": "heddle-deterministic-review",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 201:
                      raise RuntimeError(f"HTTP {response.status}")
                  payload = json.load(response)
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, json.JSONDecodeError, OSError, RuntimeError) as error:
              print(f"::error::could not publish semgrep-verdict={mark} for {sha} ({type(error).__name__}) — {remedy}. Failing closed.")
              raise SystemExit(1)
          if (payload.get("name") != "semgrep-verdict" or payload.get("head_sha") != sha or
                  payload.get("status") != "completed" or payload.get("conclusion") != mark):
              print(f"::error::Checks API returned an unverified semgrep-verdict marker for {sha} — {remedy}. Failing closed.")
              raise SystemExit(1)
          print(f"real verdict = {mark} (job status before marker={os.environ['JOB_STATUS']}); recorded as semgrep-verdict for {sha}")
          PY

  gitleaks:
    name: gitleaks (secrets in the PR's commits)
    # PRs only — drafts INCLUDED (a leaked secret does not wait for
    # ready_for_review). Title/body edits echo the last real verdict internally;
    # retarget edits scan because the commit range moved. Push-to-main coverage
    # is GitHub secret scanning.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # INVARIANT: the edit-path timeout (15) MUST exceed the commit-path scan
    # timeout (10). The echo waits pending while that scan is in flight; if the
    # scan budget rises, raise the echo budget above it too.
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' && 15 || 10 }}
    permissions:
      contents: read
      checks: write
      security-events: write  # SARIF upload to code scanning (same-repo only)
    env:
      IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
    container:
      # Official gitleaks image (alpine + git + gitleaks), tag+digest-pinned.
      # MANUAL BUMP (Dependabot ignores container images): bump the tag and
      # refresh the digest from Docker Hub.
      image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Echo the last real gitleaks verdict (title/body edit)
        if: env.IS_EDIT == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        # The Alpine image is intentionally treated as BusyBox-only: wget does
        # HTTP and POSIX sh + grep/sed parse the small Checks API responses.
        run: |
          set -eu
          remedy="re-run the Deterministic Review scan or push a commit"
          fail_closed() {
            echo "::error::$1 for ${SHA} — ${remedy}. Failing closed."
            exit 1
          }
          for tool in wget grep sed sort tail tr wc head rm sleep; do
            command -v "$tool" >/dev/null 2>&1 || fail_closed "$tool is unavailable while echoing gitleaks-verdict"
          done
          case "$RUN_ID" in
            ''|*[!0-9]*) fail_closed "the Actions run id is unavailable while echoing gitleaks-verdict" ;;
          esac
          api_get() {
            wget -qO- \
              --header="Accept: application/vnd.github+json" \
              --header="Authorization: Bearer ${GH_TOKEN}" \
              --header="User-Agent: heddle-deterministic-review" \
              --header="X-GitHub-Api-Version: 2022-11-28" \
              "$1"
          }
          marker_file="${RUNNER_TEMP:-/tmp}/gitleaks-markers.$$"
          scan_file="${RUNNER_TEMP:-/tmp}/gitleaks-scans.$$"
          page_file="${RUNNER_TEMP:-/tmp}/gitleaks-page.$$"
          trap 'rm -f "$marker_file" "$scan_file" "$page_file"' EXIT HUP INT TERM

          # Writes every matching check-run as one line and sets CHECK_TOTAL.
          # Pagination has no arbitrary ceiling; the API's total_count is the
          # invariant, and an inconsistent or unparseable response is a red.
          collect_checks() {
            encoded_name=$1
            output_file=$2
            : > "$output_file"
            page=1
            seen=0
            expected=""
            while :; do
              url="https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs?check_name=${encoded_name}&filter=all&per_page=100&page=${page}"
              if ! response=$(api_get "$url"); then
                fail_closed "Checks API GET failed"
              fi
              one_line=$(printf '%s' "$response" | tr -d '\r\n')
              total=$(printf '%s' "$one_line" | sed -n 's/.*"total_count"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
              case "$total" in
                ''|*[!0-9]*) fail_closed "Checks API GET returned an unparseable total_count" ;;
              esac
              if [ -z "$expected" ]; then
                expected=$total
              elif [ "$total" != "$expected" ]; then
                fail_closed "Checks API pagination changed while it was being read"
              fi
              # A check-run object starts with id. Nested API objects do not,
              # so this safely makes one line per top-level check-run.
              printf '%s\n' "$one_line" | sed 's/},[[:space:]]*{"id"/}|{"id"/g' | tr '|' '\n' > "$page_file"
              page_count=$(sed -n '/"details_url"[[:space:]]*:/p' "$page_file" | wc -l | tr -d ' ')
              case "$page_count" in
                ''|*[!0-9]*) fail_closed "Checks API GET returned unparseable check runs" ;;
              esac
              sed -n '/"details_url"[[:space:]]*:/p' "$page_file" >> "$output_file"
              seen=$((seen + page_count))
              if [ "$seen" -gt "$expected" ]; then
                fail_closed "Checks API GET returned more check runs than total_count"
              fi
              if [ "$seen" -ge "$expected" ]; then
                CHECK_TOTAL=$expected
                return 0
              fi
              if [ "$page_count" -eq 0 ]; then
                fail_closed "Checks API pagination ended before total_count"
              fi
              page=$((page + 1))
            done
          }

          latest_marker() {
            collect_checks "gitleaks-verdict" "$marker_file"
            if [ "$CHECK_TOTAL" -eq 0 ]; then
              MARKER_CONCLUSION=none
              return 0
            fi
            records="${RUNNER_TEMP:-/tmp}/gitleaks-marker-records.$$"
            : > "$records"
            while IFS= read -r check || [ -n "$check" ]; do
              # `head_sha` also occurs in nested PR objects. Split before each
              # key and deliberately take the first (top-level) value.
              head_sha=$(printf '%s' "$check" | sed 's/"head_sha"/|&/g' | tr '|' '\n' | sed -n 's/^"head_sha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' | head -n 1)
              started=$(printf '%s' "$check" | sed -n 's/.*"started_at"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              check_id=$(printf '%s' "$check" | sed -n 's#.*"url"[[:space:]]*:[[:space:]]*"[^" ]*/check-runs/\([0-9][0-9]*\)".*#\1#p')
              status=$(printf '%s' "$check" | sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              conclusion=$(printf '%s' "$check" | sed -n 's/.*"conclusion"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              if [ "$head_sha" != "$SHA" ] || [ -z "$started" ] || [ -z "$check_id" ] || [ -z "$status" ] || [ -z "$conclusion" ]; then
                rm -f "$records"
                fail_closed "the gitleaks-verdict marker response was missing or ambiguous"
              fi
              printf '%s|%s|%s|%s\n' "$started" "$check_id" "$status" "$conclusion" >> "$records"
            done < "$marker_file"
            latest=$(sort -t '|' -k1,1 -k2,2n "$records" | tail -n 1)
            rm -f "$records"
            MARKER_STATUS=$(printf '%s' "$latest" | sed -n 's/^[^|]*|[^|]*|\([^|]*\)|.*$/\1/p')
            MARKER_CONCLUSION=$(printf '%s' "$latest" | sed -n 's/^[^|]*|[^|]*|[^|]*|\([^|]*\)$/\1/p')
            if [ "$MARKER_STATUS" != "completed" ] || [ -z "$MARKER_CONCLUSION" ]; then
              fail_closed "the latest gitleaks-verdict marker was incomplete or unparseable"
            fi
          }

          commit_scans_in_flight() {
            # URL encoding for: gitleaks (secrets in the PR's commits)
            collect_checks "gitleaks%20%28secrets%20in%20the%20PR%27s%20commits%29" "$scan_file"
            INFLIGHT=0
            while IFS= read -r check || [ -n "$check" ]; do
              status=$(printf '%s' "$check" | sed -n 's/.*"status"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              if [ -z "$status" ]; then
                fail_closed "the gitleaks scan check response was missing or ambiguous"
              fi
              [ "$status" = "completed" ] && continue
              other_run_id=$(printf '%s' "$check" | sed -n 's#.*"details_url"[[:space:]]*:[[:space:]]*"[^" ]*/actions/runs/\([0-9][0-9]*\)/job/[^" ]*".*#\1#p')
              case "$other_run_id" in
                ''|*[!0-9]*) fail_closed "an in-flight gitleaks check could not be identified" ;;
              esac
              [ "$other_run_id" -eq "$RUN_ID" ] && continue
              # The noop slot serializes edit echoes, so another RUNNING
              # same-name check is a commit-path scan. An older queued check
              # is also commit-path; a newer queued one is a later edit.
              if [ "$status" = "in_progress" ] || [ "$other_run_id" -lt "$RUN_ID" ]; then
                INFLIGHT=$((INFLIGHT + 1))
              fi
            done < "$scan_file"
          }

          echo "edit event — echoing the last real verdict (gitleaks-verdict marker) for $SHA"
          poll=0
          dry=0
          waited=""
          while :; do
            poll=$((poll + 1))
            latest_marker
            case "$MARKER_CONCLUSION" in
              success)
                echo "real gitleaks verdict for ${SHA} = success — gitleaks green"
                exit 0 ;;
              failure)
                fail_closed "the real gitleaks verdict was 'failure'; an edit never masks a real failure" ;;
              none) ;;
              *) fail_closed "the real gitleaks verdict had unsupported conclusion '${MARKER_CONCLUSION}'" ;;
            esac
            commit_scans_in_flight
            if [ "$INFLIGHT" -eq 0 ]; then dry=$((dry + 1)); else dry=0; fi
            # No fixed iteration ceiling: only a verifiably absent commit
            # scan, sustained after the startup grace, can end the wait.
            if [ "$poll" -gt 9 ] && [ "$dry" -ge 6 ]; then
              fail_closed "no gitleaks-verdict marker appeared and the commit-path gitleaks scan is no longer in flight"
            fi
            if [ -z "$waited" ]; then
              waited=1
              if [ -z "${GITHUB_STEP_SUMMARY:-}" ]; then
                fail_closed "GITHUB_STEP_SUMMARY is unavailable while the verdict is pending"
              fi
              {
                echo "### gitleaks — waiting for the commit-path verdict on \`${SHA}\`"
                echo "This edit run is holding \`gitleaks\` **pending** until the commit-path scan for this commit publishes its \`gitleaks-verdict\`, which the echo then reflects. Pending here means *blocked-while-scanning*, not failed."
              } >> "$GITHUB_STEP_SUMMARY" || fail_closed "the pending-state job summary could not be written"
            fi
            echo "  waiting for the commit run's gitleaks verdict on ${SHA} (poll ${poll}; marker absent, commit-path jobs in flight=${INFLIGHT}, dry=${dry})"
            if [ "$poll" -lt 12 ]; then sleep 10; else sleep 30; fi
          done

      - name: Checkout (full history — the PR range must be present)
        if: env.IS_EDIT != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the PR's commit range
        id: scan
        if: env.IS_EDIT != 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # POSIX sh (container job — see the semgrep step). Exit code 2 = leaks
        # found (job goes red); anything else non-zero = tool/infra error.
        # --redact keeps values out of logs AND out of the report; the report
        # is uploaded to code scanning below (rule/file/line only).
        #
        # FAIL-CLOSED (round-3/4 lesson): gitleaks exits 0 with "0 commits
        # scanned … no leaks found" when its internal `git log` fails — the
        # round-3 run did exactly that (dubious-ownership error in the
        # container) and went GREEN with an EMPTY scan. So the step computes
        # the expected non-merge commit count itself and refuses any run whose
        # log shows a git/tool error or a different scanned count.
        #
        # Suppressions are PR-CONTROLLED (.gitleaks.toml, .gitleaksignore,
        # inline `gitleaks:allow` comments) — a PR (or fork) that ships a
        # lenient config would otherwise scan itself green. So the scan always
        # uses the BASE branch's suppression files (a default-rules stub when
        # the base has none), never the PR's, and inline allow-comments are
        # ignored. Consequence: a suppression must land on main first (its own
        # config-only PR, reviewed by a human) before a PR can benefit from it.
        # A PR that touches those files is additionally flagged in the summary
        # (Spinventory det-tier finding, #2077).
        # Invoked via `sh` on purpose: the script sets its own `set -eu`, and
        # calling the interpreter explicitly means a lost exec bit (archive/checkout
        # quirks) cannot turn the security scan into a silent no-op (codacy).
        run: sh .github/scripts/gitleaks-range-scan.sh

      - name: Upload SARIF to code scanning
        # always(): the report matters MOST when the scan step just failed on
        # a hit. Same-repo only (write token); fork PRs keep the log verdict.
        if: >-
          always() &&
          env.IS_EDIT != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload merge-delta SARIF to code scanning
        # Separate category: these findings live in merge-only content
        # (conflict resolutions / automerge-synthesized bytes), which the
        # history scan structurally cannot report (HED-109).
        if: >-
          always() &&
          env.IS_EDIT != 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('gitleaks-delta.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gitleaks-delta.sarif
          category: gitleaks-merge-delta

      - name: Publish gitleaks verdict marker
        # Non-required recursion guard: only commit-path runs emit this marker;
        # edit-path echoes read it but never publish another marker.
        if: always() && env.IS_EDIT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -eu
          case "$JOB_STATUS" in
            success) MARK=success ;;
            *)       MARK=failure ;;
          esac
          remedy="re-run the Deterministic Review scan or push a commit"
          for tool in wget grep tr; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::$tool is unavailable while publishing gitleaks-verdict for ${SHA} — ${remedy}. Failing closed."
              exit 1
            fi
          done
          body=$(printf '{"name":"gitleaks-verdict","head_sha":"%s","status":"completed","conclusion":"%s"}' "$SHA" "$MARK")
          if ! response=$(wget -qO- \
              --header="Accept: application/vnd.github+json" \
              --header="Authorization: Bearer ${GH_TOKEN}" \
              --header="Content-Type: application/json" \
              --header="User-Agent: heddle-deterministic-review" \
              --header="X-GitHub-Api-Version: 2022-11-28" \
              --post-data="$body" \
              "https://api.github.com/repos/${REPO}/check-runs"); then
            echo "::error::could not publish gitleaks-verdict=${MARK} for ${SHA} — ${remedy}. Failing closed."
            exit 1
          fi
          one_line=$(printf '%s' "$response" | tr -d '\r\n')
          if ! printf '%s' "$one_line" | grep -Eq '"name"[[:space:]]*:[[:space:]]*"gitleaks-verdict"' ||
             ! printf '%s' "$one_line" | grep -Eq '"head_sha"[[:space:]]*:[[:space:]]*"'"$SHA"'"' ||
             ! printf '%s' "$one_line" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"completed"' ||
             ! printf '%s' "$one_line" | grep -Eq '"conclusion"[[:space:]]*:[[:space:]]*"'"$MARK"'"'; then
            echo "::error::Checks API returned an unverified gitleaks-verdict marker for ${SHA} — ${remedy}. Failing closed."
            exit 1
          fi
          echo "real verdict = ${MARK} (job status before marker=${JOB_STATUS}); recorded as gitleaks-verdict for ${SHA}"
