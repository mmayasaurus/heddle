name: Platform compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Diagnose Windows PowerShell transport
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const root = process.env.SystemRoot;
          const executable = join(root, 'System32', 'WindowsPowerShell', 'v1.0', 'powershell.exe');
          const script = join(process.env.RUNNER_TEMP, 'heddle-transport-canary.ps1');
          // Fixed non-secret canary only; never run these diagnostics with credential input.
          writeFileSync(script, `[Console]::Error.WriteLine('started');
          [Console]::InputEncoding=[Text.UTF8Encoding]::new($false);
          [Console]::Error.WriteLine('input-encoding-set');
          [Console]::OutputEncoding=[Text.UTF8Encoding]::new($false);
          [Console]::Error.WriteLine('output-encoding-set');
          $line=[Console]::In.ReadLine();
          [Console]::Error.WriteLine('input-read');
          [Console]::Out.Write($line);`);
          for (const mode of ['default', 'input-none', 'full-environment']) {
            const args = ['-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
              ...(mode === 'input-none' ? ['-InputFormat', 'None'] : []), '-File', script];
            const result = spawnSync(executable, args, { input: 'HEddle_CANARY\n', encoding: 'utf8',
              timeout: 30000, maxBuffer: 16384, windowsHide: true,
              env: mode === 'full-environment' ? process.env : { SystemRoot: root, WINDIR: root } });
            process.stdout.write(JSON.stringify({ mode, status: result.status, code: result.error?.code,
              stdout: result.stdout, stderr: result.stderr }) + '\n');
          }
          let helper = readFileSync('assets/secure-fs-windows.ps1', 'utf8');
          const stages = [
            ['Add-Type -AssemblyName System.Web.Extensions', 'assembly'],
            ['$sid = [Security.Principal.WindowsIdentity]::GetCurrent().User', 'identity'],
            ['$request = $json.DeserializeObject([Console]::In.ReadLine())', 'request'],
            ['Ensure-Directory $path $boundary $true $true', 'directory'],
          ];
          for (const [statement, stage] of stages) {
            if (helper.split(statement).length !== 2) throw new Error('ambiguous canary instrumentation');
            helper = helper.replace(statement,
              `[Console]::Error.WriteLine('before-${stage}'); ${statement}; [Console]::Error.WriteLine('after-${stage}')`);
          }
          const helperPath = join(process.env.RUNNER_TEMP, 'heddle-helper-canary.ps1');
          writeFileSync(helperPath, helper);
          for (const mode of ['default', 'input-none']) {
            const directory = join(mkdtempSync(join(process.env.RUNNER_TEMP, 'heddle-helper-')), 'private');
            const result = spawnSync(executable, ['-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
              ...(mode === 'input-none' ? ['-InputFormat', 'None'] : []), '-File', helperPath], {
              input: JSON.stringify({ operation: 'ensure-dir', path: directory, requireOwner: true }) + '\n',
              encoding: 'utf8', timeout: 30000, maxBuffer: 16384, windowsHide: true,
              env: { SystemRoot: root, WINDIR: root } });
            process.stdout.write(JSON.stringify({ mode: `actual-helper-${mode}`, status: result.status, code: result.error?.code,
              stdout: result.stdout, stderr: result.stderr }) + '\n');
          }
          NODE
      - name: Native filesystem, process, and fleet tests
        run: npx vitest run --bail=1 --reporter=verbose test/platform-process.test.ts test/platform-filesystem.test.ts test/hook-command.test.ts test/secure-fs-windows.test.ts test/client-session.test.ts test/client-hooks.test.ts test/comms/address.test.ts test/comms/log.test.ts test/comms/broker.test.ts
