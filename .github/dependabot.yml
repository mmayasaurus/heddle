# Dependabot version updates — GitHub Actions only (HED-11).
#
# Every action in .github/workflows is hash-pinned (zizmor `unpinned-uses`
# policy); Dependabot is what keeps those pins moving — it bumps the SHA and
# the `# vX.Y.Z` comment together. Grouped into one weekly PR so the reviewer
# fleet runs once, not once per action.
#
# npm/cargo VERSION updates are deliberately not enabled here (PR noise for a
# small team); Dependabot SECURITY updates are a repo setting (enabled
# 2026-08-15) and cover the vulnerable-dependency case regardless.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
