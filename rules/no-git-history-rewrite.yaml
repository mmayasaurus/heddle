id: no-git-history-rewrite
event: PreToolUse
match:
  tool: Bash
  input:
    command: '\bgit\s+(?:-C\s+\S+\s+)?(?:reset\b[^\n;|&]*?\s--hard\b|push\b[^\n;|&]*?\s(?:--force\b|-f\b|\+[^\s;|&])|branch\b[^\n;|&]*?\s(?:-[A-Za-z]*D\b|--delete\b[^\n;|&]*?--force\b|--force\b[^\n;|&]*?--delete\b))'
action: block
enforce: false
subagent_aware: true
message: 'This rewrites or force-updates git history — reset --hard, force-push
  (including --force-with-lease), or branch -D — and can discard commits or
  overwrite a shared branch irreversibly. Confirm the commits are truly
  disposable and that no one else holds the branch. Force-pushing a shared
  branch is banned by default.'
fail_open: true
provenance: HED-535
since: 2026-09-14
