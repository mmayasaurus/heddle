# Heddle routing table — v0 DRAFT (pilot scope; Maya-directed policy 2026-08-01)
# task-class → provider/model/effort/skills, with fallbacks.
# Orchestrators consult this at dispatch time; every decision is logged to the broker ledger.

version: 0

policy:
  subscriptions_only: true            # hard rule: no per-token API billing anywhere
  never_via_cursor: [claude, gpt, gemini]  # direct subscriptions cover these families
  metered_pool_guard:
    cursor_other_models:
      route_away_at_pct: 90           # DECLARED, not enforced until Cursor usage source (HED-9); near-exhaustion → reroute; NEVER on-demand overage
  reviewer_fleet_isolation:
    ollama_cloud: excluded            # reserved for PR reviewer bots (account-scoped limits)
  official_binaries_only: true        # each vendor's own CLI + own auth; never a third-party
                                      # client wearing another vendor's credentials (see README)
  cap_aware_routing:                  # HED-67 — src/capaware.ts consults ~/.heddle/usage at dispatch
    enabled: true
    route_away_at_pct: 90             # primary's binding window (5h, else 7d; cursor: its pool) >= this
                                      #   → run the class fallback instead (soft; both over → primary).
                                      # Metered refusals are structural: cursor included-api >= 100% or
                                      #   cursor.includedApiExhausted → named 3P models (kimi) REFUSED;
                                      #   cursor.onDemandLimitReached → everything on cursor REFUSED.
                                      # Unknown/stale caps never route away and never refuse.
  capabilities:                       # HED-2 — operator-owned switches for worker capability grants
    allow_exec_privileged: false      # exec-privileged (codex danger-full-access, no sandbox) stays REFUSED
                                      #   until the operator flips this; the call must ALSO pass opt_in.
  structural_caps:                    # HED-2 (Scape-derived, clean-room) — enforced in src/dispatch.ts
    max_children_per_orchestrator: 8  # in-flight workers per orchestrator; the 9th is REFUSED (ledgered)
    in_flight_stale_after_ms: 10800000  # 3h: an orphaned in-flight row stops holding a slot after this
    # depth-1 (workers cannot dispatch workers) and the capability allowlist (net, browse,
    # exec-privileged; default-deny) are structural, not tunable here — see docs/MODELS.md.
  concurrency_guards:
    agy:
      max_other_heavy_clis: null      # upstream #573 (filed vs 1.1.0) did NOT reproduce on 1.1.9:
                                      # two direct attempts with 3 then 4 long-running neighbor
                                      # CLIs all passed in ~1s (docs/LANDMINES.md). No cap needed;
                                      # adapter keeps hang-detection as a cheap backstop.
      serialize_per_conversation: true  # separate documented session-lock hang (adapter enforces)

providers:
  claude:
    auth: anthropic-subscription
    execution: headless               # HED-78: `claude -p --output-format json` under CLAUDE_CONFIG_DIR of the
                                      #   registry account (~/.heddle/accounts.json) with the most 5h headroom —
                                      #   automatic account rotation. dispatch_worker(in_session: true) keeps the
                                      #   original protocol (the orchestrator's own Agent-tool subagent: shared
                                      #   prompt cache, same account) as a structured claude-in-session instruction.
    models: [fable, opus, sonnet, haiku]
    notes: "headless posture = --permission-mode acceptEdits + an explicit tool allowlist (LANDMINES: auto aborts headless); packs via --append-system-prompt; never --bare"
  codex:
    auth: chatgpt-subscription
    execution: headless               # codex exec --json, stdin CLOSED (see docs/LANDMINES.md)
    models: [gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
    effort: [minimal, low, medium, high, xhigh]   # -c model_reasoning_effort=…
    lean_workers: true                            # codex workers run --ignore-user-config by default (adapter)
  cursor:
    auth: cursor-subscription         # Max plan
    # ⚠️ TWO POOLS, and they are NOT interchangeable:
    #   "Cursor Models"  = Grok 4.5 + Composer 2.5 — generous plan allowance. PREFER THESE.
    #   "Other Models"   = Kimi/GPT/Claude/Gemini — metered dollar pool, AND the same pool Maya's
    #                      Cursor PR-review usage draws on. Spending it here starves PR review.
    # Therefore: default Cursor work to Grok/Composer; Kimi is opt-in for genuinely hard tasks only.
    prefer_pool: cursor-models
    execution: headless               # cursor-agent -p --output-format json --trust
    models:                           # snapshot 2026-08-01 — verify against `cursor-agent models`
      # ✅ = live round-trip verified 2026-08-01, with observed latency on a trivial prompt
      - kimi-k3-high                  # ✅ 74s — slow; reserve for genuinely hard second-opinion work
      - composer-2.5                  # ✅ 1.8s — fastest verified; Cursor-native, cache-warm
      - composer-2.5-fast
      - cursor-grok-4.6-low           # ✅ in catalog 2026-08-12 — newest Grok; prefer over 4.5
      - cursor-grok-4.6-medium
      - cursor-grok-4.6-high
      - cursor-grok-4.6-xhigh
      - cursor-grok-4.5-low           # ✅ 2.8s — kept as fallback
      - cursor-grok-4.5-medium
      - cursor-grok-4.5-high
  gemini:
    status: piloting                  # agy 1.1.9 live-verified 2026-08-01: solo + 3-concurrent
                                      # (+codex+cursor neighbors) all clean; adapter stays
                                      # defensive (timeout, status check, model-echo verification)
    auth: google-subscription         # Antigravity CLI (agy) personal OAuth, quota-billed
    execution: headless               # agy -p --output-format stream-json
    # Effort is the model-slug SUFFIX (…-low/-medium/-high); do NOT also set a task-class `effort:` for
    # gemini — agy errors when `--effort` is combined with a suffixed slug (HED-28). The adapter guards
    # this, but keep the routing effort-free for gemini so the intent stays clear.
    models:                           # snapshot 2026-08-01 — verify against `agy models`
      - gemini-3.7-flash-low          # ✅ 5.6s e2e + model-echo verified 2026-08-14 (released 8-13;
      - gemini-3.7-flash-medium       #    Google's coding/agent "workhorse"; NOT yet in `agy models`
      - gemini-3.7-flash-high         #    listing but live via -m — catalog lags)
      - gemini-3.6-flash-low          # ✅ 3.0s e2e; --conversation resume verified (cache-warm)
      - gemini-3.6-flash-medium
      - gemini-3.6-flash-high
      - gemini-3.5-flash-low
      - gemini-3.5-flash-medium
      - gemini-3.5-flash-high
      - gemini-3.1-pro-low            # ✅ model-echo verified via stream-json
      - gemini-3.1-pro-high
  ollama-cloud:
    status: excluded                  # PR reviewer fleet only

# Task classes are intentionally coarse for the pilot. Refine from ledger data, not guesses.
#
# Per-class guidance fields (HED-1, 2026-08-15 — surfaced by `list_task_classes` / `heddle classes`
# so fit + cost are visible at the moment of choosing a worker; docs/MODELS.md is the narrative):
#   why:        one line — when to pick this class and why it routes where it does.
#   skills:     the skill packs a dispatch of this class gets when the caller passes none. This IS
#               the dispatch DEFAULT (routing table = where policy lives), not a suggestion. A
#               caller's explicit `skills` list REPLACES these task-fit defaults. Separately,
#               `worker-role` is mandatory for every delegated worker: the dispatcher unions it into
#               whichever list applies, so an explicit list can add packs but can never drop
#               worker-role. A class's fallback route inherits `skills`/`mcp` unless the fallback
#               node sets its own (effort is per-provider and is not inherited).
#   edits_code: true for classes whose workers change files. Drives the dispatch-guidance hook's
#               "code-editing class dispatched with no task-fit packs" nudge and the `worker-role`+
#               `quality-gate` pairing rule in MODELS.md. Review/read-only classes are false.
#   read_only:  (HED-3) the worker must not change the worktree: heddle passes a read-only sandbox where
#               the CLI has one (codex --sandbox read-only; claude --tools Read,Grep,Glob) and always
#               snapshots `git status`/`git diff` before+after — a mutated worktree is a MANDATE
#               VIOLATION recorded on the review row (findings are still returned).
#   auto_assess: (HED-3) run assess_result on the worker's output and return the assessment with it.
#   reviewer_pool: (HED-3) ordered provider/model alternatives used when the caller names the
#               author's provider (`author_provider`) — a reviewer must be a DIFFERENT family.
task_classes:
  orchestration:            # decompose, integrate, judge, land — the orchestrator itself
    provider: claude
    model: fable
    why: decompose, integrate, judge, land — the orchestrator's own in-session work; never dispatched to a subprocess
    skills: []
    edits_code: false
    dispatchable: false     # the orchestrator's OWN class — a dispatch of it is refused ("continue in-session")
  deep-implementation:      # gnarly features, cross-cutting refactors, subtle bugs
    provider: claude
    model: opus
    mcp: [memtrace]         # code navigation matters most here — attach discovery by default
    fallback: {provider: codex, model: gpt-5.6-sol}
    why: gnarly features, cross-cutting refactors, subtle bugs — Opus has the strongest coding judgment; Sol is an independent coding lineage when Opus is spent
    skills: [worker-role, code-discovery, quality-gate]
    edits_code: true
  implementation:           # well-scoped feature work with clear spec
    provider: codex
    model: gpt-5.6-terra
    mcp: [memtrace]
    fallback: {provider: claude, model: sonnet}
    why: well-scoped feature with a clear spec — Terra (Codex) is the default coding workhorse; Sonnet is the Claude-family fallback. Do not spend Opus here. (Primary flipped Claude→Codex 2026-08-17, HED-148, per Maya's move-load-off-Claude directive; effort left at the codex default that authored well here as the prior fallback.)
    skills: [worker-role, code-discovery, quality-gate]
    edits_code: true
  second-opinion:           # independent diagnosis/review of a diff or plan (diversity valuable)
    provider: cursor
    model: cursor-grok-4.6-high   # Cursor-Models pool — does NOT touch the PR-review dollar pool
    fallback: {provider: gemini, model: gemini-3.1-pro-high}
    why: independent diagnosis/review of a diff or plan — diversity of model FAMILY is the point; Grok sits on the generous Cursor-Models pool. Give it a SELF-CONTAINED brief (no memtrace); expect 5-8 min (grok ran ~374-520s in the 2026-08-18 ledger), so pick it deliberately — for a SMALL diff use quick-alt-take (grok-medium) instead.
    skills: [worker-role]
    edits_code: false
  second-opinion-hard:      # opt-in only: costs the metered pool PR review needs
    provider: cursor
    model: kimi-k3-high
    requires_explicit_opt_in: true
    note: burns "Other Models" dollars shared with Cursor PR review — ask before using
    why: opt-in only — Kimi is ~74s even on a trivial prompt and bills the metered "Other Models" pool that Cursor PR review draws on; ask Maya first
    skills: [worker-role]
    edits_code: false
  escalate-judgment:        # genuinely hard bounded problems — Fable as an OOP worker (Maya 2026-08-16)
    provider: claude
    model: fable
    fallback: {provider: claude, model: opus}
    why: the Anthropic-side mirror of Sol's hard-problem role — dispatch Fable OUT-OF-PROCESS for a genuinely hard, bounded problem (account-picked by Fable-weekly headroom); at/over the 45% fable-weekly soft cap the class routes to Opus instead (cap:fable-soft-cap). Ledgered like every dispatch so Fable-class counts are visible. Not for labor — codex/cursor classes stay the default.
    skills: [worker-role]
    edits_code: false
    auto_assess: true
  bulk-mechanical:          # renames, sweeps, codemods, boilerplate, test scaffolds
    provider: codex
    model: gpt-5.6-luna
    effort: low             # cheap + fast for low-reasoning mechanical work
    mcp: [memtrace]         # memtrace-first discipline for every code-editing class (Maya, 2026-08-15)
    fallback: {provider: cursor, model: composer-2.5-fast}
    why: renames, sweeps, codemods, boilerplate, test scaffolds — Luna at low effort is cheap volume; the -fast fallback bills ~2x on Cursor
    skills: [worker-role, quality-gate]
    edits_code: true
  scaffold:                 # fast structural code drafts — Cursor's coding-tuned model
    provider: cursor
    model: composer-2.5
    mcp: [memtrace]         # memtrace-first discipline for every code-editing class (Maya, 2026-08-15)
    fallback: {provider: codex, model: gpt-5.6-luna}
    why: fast structural drafts (files, stubs, wiring) — Composer is Cursor-native, cache-warm, ~1.8s on a trivial prompt; coding-tuned, not a reasoner. Fallback stays codex/luna (NOT a Cursor sibling) — it is the CAPABILITY-FIT escape hatch, since only codex enforces net/exec capabilities, so scaffold work needing one falls to codex (test/dispatch-caps.test.ts). The generous Cursor-Models pool rarely needs cap-overflow anyway. (HED-79 retune 2026-08-18 considered a grok-medium fallback for overflow and REJECTED it — it would have removed the capability path.)
    skills: [worker-role, quality-gate]
    edits_code: true
  research-summarize:       # doc reading, log triage, summarization
    provider: claude
    model: haiku
    fallback: {provider: codex, model: gpt-5.6-luna}
    why: doc reading, log triage, summarization — Haiku is the cheap Claude; never spend Sonnet/Opus reading logs
    skills: [worker-role]
    edits_code: false
  documentation:            # READMEs, comments, changelogs, docstrings — minimal reasoning need
    provider: gemini         # gemini-flash: cheap, fast, fine for prose-over-known-facts
    model: gemini-3.6-flash-low
    fallback: {provider: codex, model: gpt-5.6-luna}
    why: READMEs, comments, changelogs, docstrings — Flash is cheap and fast for prose over known facts; not for designing architecture
    skills: [worker-role]
    edits_code: false       # prose edits only; no quality-gate, no code discovery
  quick-alt-take:           # cheap fast alternative draft to compare against primary
    provider: cursor
    model: cursor-grok-4.6-medium
    why: cheap second draft, and the cheap REVIEW variant for SMALL diffs — same Grok family as second-opinion at lower effort (grok-medium); prefer this over second-opinion when the diff is small (HED-79 retune 2026-08-18)
    skills: [worker-role]
    edits_code: false
  adversarial-review:       # HED-3 (Maya: "super important") — a DIFFERENT model family reviews a diff/
    provider: cursor        #   worktree read-only, find-only; the author fixes; the ledger scores each
    model: cursor-grok-4.6-high   # author→reviewer provider pair by accepted-finding rate.
    fallback: {provider: codex, model: gpt-5.6-sol}   # HED-249: MUST be mcp-attachable (see mcp: below). Codex is memtrace-capable AND a different family from cursor + claude authors, so review diversity holds. NOT gemini: agy has no worker-MCP path, so a gemini fallback HARD-FAILED the whole dispatch on a transient cursor blip — cursor was a SPOF (ledger 254).
    mcp: [memtrace]         # HED-205 default so a reviewer gets code discovery (else it trips the memtrace-first hook and returns a complaint instead of findings, ledger 206). HED-249 HARD CONSTRAINT: every provider this class can resolve to — primary, fallback, AND every reviewer_pool entry — MUST be worker-MCP-attachable. gemini/agy is NOT, so it is kept OUT of this class entirely (refusing loudly beats a silent discovery-less review). A CI invariant test (routing.test.ts) enforces this for all mcp-carrying classes.
    reviewer_pool:          # first entry whose provider differs from `author_provider` is used. HED-249: no gemini — this class carries mcp and gemini can't attach it (pickReviewer's usable() gate does not check mcp, so a gemini pick would hard-fail the dispatch).
      - {provider: cursor, model: cursor-grok-4.6-high}
      - {provider: codex, model: gpt-5.6-sol}
      - {provider: claude, model: opus}
    why: pre-PR adversarial review by another model family, read-only + find-only, with a test-quality lens (a toggle test is not a behavior test); the author fixes, the ledger scores reviewer pairs
    skills: [worker-role, adversarial-review]
    edits_code: false
    read_only: true
    auto_assess: true
  gemini-analysis:          # long-context reading, doc/log analysis, cross-checking
    provider: gemini
    model: gemini-3.1-pro-high
    fallback: {provider: cursor, model: composer-2.5}
    why: long-context reading, doc/log analysis, cross-checking, web-grounded research (agy has Google Search) — Gemini is still piloting
    skills: [worker-role]
    edits_code: false
  web-research:             # first action must be a live web search
    provider: gemini
    model: gemini-3.1-pro-high
    requires_web: true
    fallback: {provider: codex, model: gpt-5.6-sol, capabilities: [browse]}
    why: live web research whose first action must be search-grounded; Gemini grounds intrinsically and the Codex fallback receives an enforceable browse grant
    skills: [worker-role]
    edits_code: false
